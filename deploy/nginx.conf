# Reverse proxy for the portal (Docker Compose publishes the app on 127.0.0.1:3001 or :3001).
# Put certificates in place (e.g. certbot --nginx -d bim.example.com), replace bim.example.com, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portal && sudo ln -s ../sites-available/portal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# In .env: PUBLIC_URL=https://bim.example.com and COOKIE_SECURE=true.

server {
    listen 80;
    server_name bim.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bim.example.com;

    ssl_certificate     /etc/letsencrypt/live/bim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bim.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Match VIDEO_MAX_MB (default 2048) so administrators can upload training videos; files go through MAX_UPLOAD_MB.
    client_max_body_size 2g;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;   # the app trusts this to mark the session cookie Secure
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # long video uploads and AI answers
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
